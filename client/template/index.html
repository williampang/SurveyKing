<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>模板广场 - 卷王问卷考试系统</title>
    <link rel="stylesheet" href="/shared/layout.css" />
    <style>
      .template-filter-card {
        background: #fff;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-base);
        padding: 16px 20px;
        margin-bottom: 16px;
      }
      .filter-row {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
      }
      .filter-row:last-child {
        margin-bottom: 0;
      }
      .filter-label {
        width: 60px;
        color: var(--text-muted);
        font-size: 13px;
        flex-shrink: 0;
      }
      .filter-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .filter-tag {
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 13px;
        cursor: pointer;
        color: var(--text-secondary);
        transition: all 0.2s;
      }
      .filter-tag:hover {
        color: var(--primary);
      }
      .filter-tag.active {
        background: var(--primary);
        color: #fff;
      }
      .template-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
      }
      .template-card {
        background: #fff;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-base);
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: all 0.3s;
      }
      .template-card:hover {
        box-shadow: var(--shadow-card);
        border-color: #d9d9d9;
      }
      .template-title {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 8px;
        color: var(--text-main);
      }
      .template-desc {
        font-size: 13px;
        color: var(--text-muted);
        margin: 0 0 16px;
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .template-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--border-color);
        padding-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
